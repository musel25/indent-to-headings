name: Release

on:
  push:
    tags:
      - "*"

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            manifest.json
            main.js
            styles.css
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            manifest.json
            main.js
            styles.css
